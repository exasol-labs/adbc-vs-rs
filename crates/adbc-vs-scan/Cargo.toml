[package]
name = "adbc-vs-scan"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
mysql-it = []

postgres-it = []

trino-it = []

# Read at build time only; the shipped `.so` links neither.
[build-dependencies]
serde.workspace = true
toml.workspace = true

[dependencies]
adbc_core.workspace = true
adbc_driver_manager.workspace = true
arrow.workspace = true

[dev-dependencies]
# Dev-only back edge onto the adapter, so the integration tier reuses its install code.
adbc-vs-adapter = { path = "../adbc-vs-adapter", version = "0.7.0" }
flate2.workspace = true
reqwest.workspace = true
tar.workspace = true

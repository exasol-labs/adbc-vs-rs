# The MySQL ADBC driver adbc-vs loads.
#
# The file name is the driver's canonical name — the value the `DRIVER`
# property takes and `adapterNotes.driver` records. `build.rs` generates the
# compiled-in table from this file; nothing here is read at run time.

[package]
# The path the driver registry index publishes this driver's versions under.
registry_path = "mysql"

# The shared library the package installs, as its `MANIFEST` names it. The
# BucketFS install path is built from it, so a package declaring anything else
# is refused rather than installed under a name the presence check never reads.
library = "libadbc_driver_mysql.so"

# The driver `.so` exports both `AdbcDriverMysqlInit` and
# `AdbcDriverMySQLInit`. Naming one explicitly avoids depending on the driver
# manager's filename-derivation heuristic, which happens to pick the same
# symbol today but is pinned by nothing in the driver's own manifest.
entry_point = "AdbcDriverMysqlInit"

# The published versions this release accepts. Independent of every other
# driver's range: it stops below 0.7.0 because nothing has measured this
# adapter against a 0.7 driver, not because of a shared rule.
version_range = ">=0.6.0, <0.7.0"

# What the MySQL dialect advertises to Exasol, and therefore what Exasol
# delegates to it. Exasol re-applies no delegated fragment, so an entry here
# that `mysql_dialect.rs` cannot render returns wrong rows rather than an
# error: the two are one decision, and the capability invariant test renders
# every entry below to hold them together.
#
# The names are `virtual-schema-common-java`'s protocol vocabulary. Nothing
# validates them at build time — this list is the adapter's only list of
# capability names, and a second one to check it against is what that
# arrangement exists to avoid.
#
# Grouped for a reader; Exasol reads the array as a set.
[capabilities]
advertised = [
    "SELECTLIST_PROJECTION",
    "SELECTLIST_EXPRESSIONS",
    "FILTER_EXPRESSIONS",
    "AGGREGATE_SINGLE_GROUP",
    "AGGREGATE_GROUP_BY_COLUMN",
    "FN_AGG_COUNT",
    "FN_AGG_COUNT_STAR",
    "FN_AGG_COUNT_DISTINCT",
    "FN_AGG_MIN",
    "FN_AGG_MAX",
    "FN_PRED_AND",
    "FN_PRED_OR",
    "FN_PRED_NOT",
    "FN_PRED_EQUAL",
    "FN_PRED_NOTEQUAL",
    "FN_PRED_LESS",
    "FN_PRED_LESSEQUAL",
    "FN_PRED_IS_NULL",
    "FN_PRED_IS_NOT_NULL",
    "FN_PRED_LIKE",
    "FN_PRED_LIKE_ESCAPE",
    "FN_PRED_BETWEEN",
    "FN_PRED_IN_CONSTLIST",
    "LITERAL_NULL",
    "LITERAL_EXACTNUMERIC",
    "LITERAL_DOUBLE",
    "LITERAL_STRING",
    "LITERAL_DATE",
    "LITERAL_TIMESTAMP",
    "JOIN",
    "JOIN_TYPE_INNER",
    "JOIN_TYPE_LEFT_OUTER",
    "JOIN_TYPE_RIGHT_OUTER",
    "JOIN_CONDITION_EQUI",
]

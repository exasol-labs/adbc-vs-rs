# The PostgreSQL ADBC driver adbc-vs loads.
#
# The file name is the driver's canonical name — the value the `DRIVER`
# property takes and `adapterNotes.driver` records. `build.rs` generates the
# compiled-in table from this file; nothing here is read at run time.

[package]
# The path the driver registry index publishes this driver's versions under.
registry_path = "postgresql"

# The shared library the package installs, as its `MANIFEST` names it. Read
# out of the published `1.12.0` package's own `[Files] driver` entry rather
# than derived from the driver name, because provisioning compares the
# manifest against this value and installs only the file it names.
library = "libadbc_driver_postgresql.so"

# The ADBC entry-point symbol the driver manager loads the library through,
# named rather than left to the manager's filename-derivation heuristic.
entry_point = "AdbcDriverPostgresqlInit"

# The published versions this release accepts. Independent of every other
# driver's range: it admits every 1.x because the driver's own 1.0 release
# fixed its ADBC surface, where MySQL's range stops below 0.7.0 for reasons
# that have nothing to do with this one.
version_range = ">=1.12.0, <2.0.0"

# What the PostgreSQL dialect advertises to Exasol, and therefore what Exasol
# delegates to it. Exasol re-applies no delegated fragment, so an entry here
# that `postgres_dialect.rs` cannot render returns wrong rows rather than an
# error: the two are one decision, and the capability invariant test renders
# every entry below to hold them together.
#
# The list is MySQL's set plus `JOIN_TYPE_FULL_OUTER`, and that one entry is
# the whole of what the two targets genuinely disagree on: PostgreSQL
# implements the keyword directly, and MySQL implements no `FULL OUTER JOIN`.
# The two lists are stated independently rather than one derived from the
# other, and `capabilities_tests` asserts the difference is exactly that entry.
# Narrowing a set is always safe — Exasol applies whatever it did not delegate
# itself — while advertising a fragment the renderer cannot express is the
# silent wrong-rows failure the invariant exists to prevent.
#
# `JOIN_CONDITION_ALL` stays absent, and it is what keeps `JOIN_TYPE_FULL_OUTER`
# safe: PostgreSQL refuses a full join whose condition is neither
# merge-joinable nor hash-joinable — measured, `ON "l"."k" < "r"."k"` is
# rejected on 18.6 — and the equality `JOIN_CONDITION_EQUI` admits is both.
#
# `FN_AGG_SUM`, `FN_AGG_SUM_DISTINCT`, `FN_AGG_AVG`, and `FN_AGG_AVG_DISTINCT`
# stay absent, and their absence is a framework decision rather than a
# PostgreSQL one: `vs-adapter/pushdown-aggregation` withholds all four for
# every dialect, because a capability is advertised once per session and admits
# every numeric operand, including `double precision`, whose sum is
# order-dependent under a parallel plan.
#
# The names are `virtual-schema-common-java`'s protocol vocabulary. Nothing
# validates them at build time — this list is the adapter's only list of
# capability names, and a second one to check it against is what that
# arrangement exists to avoid.
#
# Grouped for a reader; Exasol reads the array as a set.
[capabilities]
advertised = [
    "SELECTLIST_PROJECTION",
    "SELECTLIST_EXPRESSIONS",
    "FILTER_EXPRESSIONS",
    "AGGREGATE_SINGLE_GROUP",
    "AGGREGATE_GROUP_BY_COLUMN",
    "FN_AGG_COUNT",
    "FN_AGG_COUNT_STAR",
    "FN_AGG_COUNT_DISTINCT",
    "FN_AGG_MIN",
    "FN_AGG_MAX",
    "FN_PRED_AND",
    "FN_PRED_OR",
    "FN_PRED_NOT",
    "FN_PRED_EQUAL",
    "FN_PRED_NOTEQUAL",
    "FN_PRED_LESS",
    "FN_PRED_LESSEQUAL",
    "FN_PRED_IS_NULL",
    "FN_PRED_IS_NOT_NULL",
    "FN_PRED_LIKE",
    "FN_PRED_LIKE_ESCAPE",
    "FN_PRED_BETWEEN",
    "FN_PRED_IN_CONSTLIST",
    "LITERAL_NULL",
    "LITERAL_EXACTNUMERIC",
    "LITERAL_DOUBLE",
    "LITERAL_STRING",
    "LITERAL_DATE",
    "LITERAL_TIMESTAMP",
    "JOIN",
    "JOIN_TYPE_INNER",
    "JOIN_TYPE_LEFT_OUTER",
    "JOIN_TYPE_RIGHT_OUTER",
    "JOIN_TYPE_FULL_OUTER",
    "JOIN_CONDITION_EQUI",
]

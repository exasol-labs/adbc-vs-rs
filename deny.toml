# adbc-vs dependency policy, checked by
# crates/adbc-vs-adapter/tests/policy_test.rs (AGENTS.md, "Security and policy").
#
# Scope: this policy governs the Rust crate dependency tree only. The MySQL,
# PostgreSQL, and Trino ADBC drivers fetched at run time from the dbc registry
# are never bundled into an adbc-vs release artifact, so they fall outside this
# policy (specs/_recorded/001-add-mysql-vs-mvp/decision-log.md [15]).

[licenses]
# Permissive-only allow list. No copyleft (GPL/LGPL/AGPL/MPL) and no
# standalone `OpenSSL` identifier is ever added here — the one crate that
# inherits an `OpenSSL`-licensed file is handled below via a scoped exception
# instead of widening this list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

# This policy grants no license exception today: reqwest's rustls-tls-webpki-roots
# feature and rustls's ring provider (see crates/adbc-vs-adapter/Cargo.toml) keep
# aws-lc-sys, the one crate this policy has ever needed to except, out of the
# dependency graph. Adding an exception here — for example if a future TLS
# provider change pulls aws-lc-sys back in under its OpenSSL-derived file — is a
# reviewed change.
exceptions = []

[licenses.private]
# Workspace crates (adbc-vs-adapter, adbc-vs-scan) are MIT-licensed but
# unpublished, so their own license checks are skipped rather than requiring
# them to appear in the allow list.
ignore = true

[bans]
wildcards = "deny"
allow-workspace = true

[advisories]
# Every ignore entry MUST be preceded by a comment giving the ISO-8601 date
# the exception was granted and the condition under which it is re-evaluated
# (see policy_test.rs::advisory_ignores_are_dated). The `serde_yaml`
# RUSTSEC-2024-0370 advisory was avoided outright by depending on
# `serde_yaml_ng` instead (001-add-mysql-vs-mvp decision-log [11]).
ignore = [
    # unsafe-libyaml is unmaintained with no safe upgrade. Only serde_yaml_ng
    # reaches it, to parse the registry index fetched over verified TLS.
    # 2026-10-22 re-evaluate when serde_yaml_ng drops unsafe-libyaml.
    "RUSTSEC-2024-0449",
    # chrono is unmaintained with no safe upgrade. Only arrow reaches it, for the
    # temporal arrays and casts the scan coerces timestamps through; no adbc-vs
    # code names chrono, and arrow-array 60.1.0 still requires it.
    # 2026-11-17 re-evaluate when arrow drops chrono or adopts jiff or time.
    "RUSTSEC-2026-0543",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the SLC-compatible shared object
        run: make cross-udf-build
      - name: Assert the artifact
        run: make test-artifact
      - name: Upload UDF .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: adbc-vs-so
          path: target/release/libadbc_vs_adapter.so

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: make test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check dependency policy
        run: make deny

  # Each source's tier is its own job. Sharing one would run the second only
  # while the first passed, so a red MySQL tier would leave PostgreSQL with no
  # signal at the moment it is most needed — and `release`'s `needs` could not
  # tell "passed" from "never ran".
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the MySQL-only integration tier
        run: make test-it

  integration-tests-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the PostgreSQL-only integration tier
        run: make test-it-postgres

  integration-tests-trino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Trino-only integration tier
        run: make test-it-trino

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache /usr/local/.ghcup
          docker image prune -af
      - name: Relax AppArmor for the Exasol UDF sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install exapump
        run: |
          curl -fsSL https://raw.githubusercontent.com/exasol-labs/exapump/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the end-to-end tier
        run: make test-e2e
      - name: Dump the Exasol container log
        if: failure()
        run: docker compose logs exasol > exasol.log
      - name: Upload the Exasol container log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exasol-container-log
          path: exasol.log

  e2e-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache /usr/local/.ghcup
          docker image prune -af
      - name: Relax AppArmor for the Exasol UDF sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install exapump
        run: |
          curl -fsSL https://raw.githubusercontent.com/exasol-labs/exapump/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the PostgreSQL end-to-end tier
        run: make test-e2e-postgres
      - name: Dump the Exasol container log
        if: failure()
        run: docker compose logs exasol > exasol-postgres.log
      - name: Upload the Exasol container log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exasol-container-log-postgres
          path: exasol-postgres.log

  e2e-trino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache /usr/local/.ghcup
          docker image prune -af
      - name: Relax AppArmor for the Exasol UDF sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install exapump
        run: |
          curl -fsSL https://raw.githubusercontent.com/exasol-labs/exapump/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the Trino end-to-end tier
        run: make test-e2e-trino
      - name: Dump the Exasol container log
        if: failure()
        run: docker compose logs exasol > exasol-trino.log
      - name: Upload the Exasol container log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exasol-container-log-trino
          path: exasol-trino.log

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      [
        build-so,
        lint,
        unit-tests,
        deny,
        integration-tests,
        integration-tests-postgres,
        integration-tests-trino,
        e2e,
        e2e-postgres,
        e2e-trino,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release (tag absent == version bumped)
        id: gate
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — version not bumped; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped to ${{ steps.version.outputs.version }} — releasing ${{ steps.version.outputs.tag }}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download UDF .so artifact
        if: steps.gate.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: adbc-vs-so
          path: target/release

      - name: Package release tarball
        if: steps.gate.outputs.release == 'true'
        run: make release-tarball

      - name: Install Rust 1.94
        if: steps.gate.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@1.94

      - name: Install cargo-about
        if: steps.gate.outputs.release == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.0

      - name: Generate third-party notices
        if: steps.gate.outputs.release == 'true'
        run: make third-party-licenses

      - name: Create and push tag
        if: steps.gate.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/adbc-vs.tar.gz
            dist/THIRD-PARTY-LICENSES.md

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["specs/**", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["specs/**", "docs/**"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Every job that builds or tests the library runs on both architectures, so the
  # `#[cfg(target_arch)]` branches are compiled and exercised, not only written.
  # Each job's `.so` is built on a runner of its own architecture, never cross-
  # compiled, because `cargo exasol-udf validate` loads it.
  build-so:
    name: build-so (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94
      - name: Build the SLC-compatible shared object
        run: make cross-udf-build
      - name: Assert the artifact
        run: make test-artifact
      - name: Upload UDF .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: adbc-vs-so-${{ runner.arch }}
          path: target/release/libadbc_vs_adapter.so

  lint:
    name: lint (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint

  unit-tests:
    name: unit-tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94
      - name: Run unit tests
        run: make test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check dependency policy
        run: make deny

  # Each source's tier is its own job. Sharing one would run the second only
  # while the first passed, so a red MySQL tier would leave PostgreSQL with no
  # signal at the moment it is most needed — and `package`'s `needs` could not
  # tell "passed" from "never ran".
  integration-tests:
    name: integration-tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94
      - name: Run the MySQL-only integration tier
        run: make test-it

  integration-tests-postgres:
    name: integration-tests-postgres (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94
      - name: Run the PostgreSQL-only integration tier
        run: make test-it-postgres

  integration-tests-trino:
    name: integration-tests-trino (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94
      - name: Run the Trino-only integration tier
        run: make test-it-trino

  e2e:
    name: e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker-2025
            runner: ubuntu-latest
            target: docker
            image: exasol/docker-db:latest-2025.2
          - name: docker-2026
            runner: ubuntu-latest
            target: docker
            image: exasol/docker-db:latest-2026.1
          - name: personal-x86_64
            runner: ubuntu-latest
            target: personal
          - name: personal-arm64
            runner: ubuntu-24.04-arm
            target: personal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache /usr/local/.ghcup
          docker image prune -af
      - name: Relax AppArmor for the Exasol UDF sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94
      - name: Install exapump
        run: |
          curl -fsSL https://raw.githubusercontent.com/exasol-labs/exapump/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Podman for Exasol Personal
        if: matrix.target == 'personal'
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          podman --version
      - name: Install the Exasol Personal launcher
        if: matrix.target == 'personal'
        run: |
          curl -fsSL https://downloads.exasol.com/exasol-personal/installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the end-to-end tier
        env:
          EXASOL_TARGET: ${{ matrix.target }}
          EXASOL_IMAGE: ${{ matrix.image }}
        run: make test-e2e
      - name: Dump the Exasol container log
        if: failure()
        run: |
          if [ "${{ matrix.target }}" = personal ]; then
            for container in $(podman ps -a --filter name=exasol-db- --format '{{.Names}}'); do
              podman logs "$container"
            done > exasol.log 2>&1 || true
          else
            docker compose logs exasol > exasol.log
          fi
      - name: Upload the Exasol container log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exasol-container-log-${{ matrix.name }}
          path: exasol.log

  e2e-postgres:
    name: e2e-postgres (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker-2025
            runner: ubuntu-latest
            target: docker
            image: exasol/docker-db:latest-2025.2
          - name: docker-2026
            runner: ubuntu-latest
            target: docker
            image: exasol/docker-db:latest-2026.1
          - name: personal-x86_64
            runner: ubuntu-latest
            target: personal
          - name: personal-arm64
            runner: ubuntu-24.04-arm
            target: personal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache /usr/local/.ghcup
          docker image prune -af
      - name: Relax AppArmor for the Exasol UDF sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94
      - name: Install exapump
        run: |
          curl -fsSL https://raw.githubusercontent.com/exasol-labs/exapump/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Podman for Exasol Personal
        if: matrix.target == 'personal'
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          podman --version
      - name: Install the Exasol Personal launcher
        if: matrix.target == 'personal'
        run: |
          curl -fsSL https://downloads.exasol.com/exasol-personal/installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the PostgreSQL end-to-end tier
        env:
          EXASOL_TARGET: ${{ matrix.target }}
          EXASOL_IMAGE: ${{ matrix.image }}
        run: make test-e2e-postgres
      - name: Dump the Exasol container log
        if: failure()
        run: |
          if [ "${{ matrix.target }}" = personal ]; then
            for container in $(podman ps -a --filter name=exasol-db- --format '{{.Names}}'); do
              podman logs "$container"
            done > exasol-postgres.log 2>&1 || true
          else
            docker compose logs exasol > exasol-postgres.log
          fi
      - name: Upload the Exasol container log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exasol-container-log-postgres-${{ matrix.name }}
          path: exasol-postgres.log

  e2e-trino:
    name: e2e-trino (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker-2025
            runner: ubuntu-latest
            target: docker
            image: exasol/docker-db:latest-2025.2
          - name: docker-2026
            runner: ubuntu-latest
            target: docker
            image: exasol/docker-db:latest-2026.1
          - name: personal-x86_64
            runner: ubuntu-latest
            target: personal
          - name: personal-arm64
            runner: ubuntu-24.04-arm
            target: personal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache /usr/local/.ghcup
          docker image prune -af
      - name: Relax AppArmor for the Exasol UDF sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94
      - name: Install exapump
        run: |
          curl -fsSL https://raw.githubusercontent.com/exasol-labs/exapump/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Podman for Exasol Personal
        if: matrix.target == 'personal'
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          podman --version
      - name: Install the Exasol Personal launcher
        if: matrix.target == 'personal'
        run: |
          curl -fsSL https://downloads.exasol.com/exasol-personal/installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the Trino end-to-end tier
        env:
          EXASOL_TARGET: ${{ matrix.target }}
          EXASOL_IMAGE: ${{ matrix.image }}
        run: make test-e2e-trino
      - name: Dump the Exasol container log
        if: failure()
        run: |
          if [ "${{ matrix.target }}" = personal ]; then
            for container in $(podman ps -a --filter name=exasol-db- --format '{{.Names}}'); do
              podman logs "$container"
            done > exasol-trino.log 2>&1 || true
          else
            docker compose logs exasol > exasol-trino.log
          fi
      - name: Upload the Exasol container log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exasol-container-log-trino-${{ matrix.name }}
          path: exasol-trino.log

  # Packs each architecture's tarball on a runner of that architecture, because
  # `release-tarball` names it after the host and packs the host's `.so`.
  package:
    name: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    needs:
      [
        build-so,
        lint,
        unit-tests,
        deny,
        integration-tests,
        integration-tests-postgres,
        integration-tests-trino,
        e2e,
        e2e-postgres,
        e2e-trino,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download UDF .so artifact
        uses: actions/download-artifact@v4
        with:
          name: adbc-vs-so-${{ runner.arch }}
          path: target/release

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.0

      - name: Generate third-party notices
        run: make third-party-licenses

      - name: Package release tarball
        run: make release-tarball

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.arch }}
          path: dist/adbc-vs*.tar.gz

      - name: Upload third-party notices
        if: runner.arch == 'X64'
        uses: actions/upload-artifact@v4
        with:
          name: package-licenses
          path: dist/THIRD-PARTY-LICENSES.md

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release (tag absent == version bumped)
        id: gate
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — version not bumped; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped to ${{ steps.version.outputs.version }} — releasing ${{ steps.version.outputs.tag }}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the release tarballs and third-party notices
        if: steps.gate.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Verify the release assets
        if: steps.gate.outputs.release == 'true'
        run: ls -l dist/adbc-vs.tar.gz dist/adbc-vs-linux-arm64.tar.gz dist/THIRD-PARTY-LICENSES.md

      - name: Create and push tag
        if: steps.gate.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/adbc-vs.tar.gz
            dist/adbc-vs-linux-arm64.tar.gz
            dist/THIRD-PARTY-LICENSES.md

# adbc-vs Trino E2E/integration fixture.
#
# Mounted over the stock image's single-node config.properties so this
# repo's stack gets TLS and password authentication. Everything the stock
# file sets for a working single-node cluster is repeated here on purpose --
# node.properties and every file under /etc/trino/catalog/ except
# memory.properties (mounted from docker/trino/memory.properties to raise its
# per-node data cap) are left unmounted and keep the image's own defaults.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=static

# The certificate is a self-signed PEM generated by `make stack-up-trino`
# into the gitignored docker/trino/generated/ (never committed) and mounted
# read-only at the path below. A PEM keystore takes no password --
# http-server.https.keystore.key applies only to a JKS/P12 keystore.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/keystore.pem

# File-based password authentication: see password-authenticator.properties
# and password.db beside this file. http-server.authentication.allow-insecure-over-http
# is deliberately left unset, keeping Trino's own default of false, so the
# published 8080 port answers no query at all.
http-server.authentication.type=PASSWORD

internal-communication.shared-secret=adbc-vs-trino-e2e-shared-secret

# The `memory` catalog every Trino tier reads, mounted over the stock image's
# own memory.properties (which sets `connector.name=memory` and nothing else).
#
# The connector's default `memory.max-data-per-node` is 128MB. The benchmark
# keeps all three of its tiers (narrow_small, narrow_large, wide) resident in
# this catalog at once, estimated at roughly 100MB of retained Trino pages
# together, which leaves too little headroom under that default for an
# estimate. 512MB raises the cap well above the data while staying under the
# ~1.6GB heap the container's `mem_limit: 2g` gives the JVM
# (jvm.config's MaxRAMPercentage=80), so a runaway table still trips the
# connector's own limit error before the JVM runs out of heap and
# `-XX:+ExitOnOutOfMemoryError` takes the whole container down.
connector.name=memory
memory.max-data-per-node=512MB
